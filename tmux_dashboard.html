<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tmux dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0e1012;
    --bg2:       #141618;
    --bg3:       #191c1f;
    --border:    #242729;
    --border2:   #2e3235;

    --text:      #d4d8de;
    --muted:     #525a62;
    --dim:       #333a40;

    --session:   #4a9eff;
    --window:    #e6a94a;
    --active:    #3dd68c;
    --waiting:   #f0605a;
    --cmd:       #7ec8e3;
    --path:      #6b9fd4;
    --preview:   #8a96a2;

    --current-bg: rgba(61, 214, 140, 0.05);
    --current-border: rgba(61, 214, 140, 0.22);

    --radius: 8px;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.5;
    min-height: 100vh;
    padding: 0;
  }

  /* ── header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 15px;
    color: #fff;
    letter-spacing: -0.3px;
  }

  .logo span {
    color: var(--active);
  }

  .badge {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 20px;
    background: rgba(91, 138, 245, 0.15);
    color: var(--session);
    border: 1px solid rgba(91, 138, 245, 0.2);
    font-weight: 500;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  #clock {
    font-size: 11px;
    color: var(--muted);
    font-weight: 300;
    letter-spacing: 0.5px;
  }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--active);
    box-shadow: 0 0 6px var(--active);
    animation: pulse 2s ease-in-out infinite;
  }
  .status-dot.error { background: #f05a5a; box-shadow: 0 0 6px #f05a5a; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* refresh slider */
  .refresh-control {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 10px;
  }
  input[type=range] {
    -webkit-appearance: none;
    width: 60px; height: 3px;
    background: var(--border2);
    border-radius: 2px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--session);
    cursor: pointer;
  }

  /* ── main layout ── */
  main {
    padding: 10px 12px 40px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* ── error / empty state ── */
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }
  .empty h2 { font-family: var(--sans); font-size: 18px; margin-bottom: 8px; color: var(--dim); }
  .empty code {
    font-family: var(--mono);
    color: var(--text);
    background: var(--bg3);
    padding: 1px 5px;
    border-radius: 4px;
  }
  .empty-link { margin-top: 14px; }
  .empty-link a {
    color: var(--session);
    text-decoration: none;
    font-size: 11px;
  }
  .empty-link a:hover { text-decoration: underline; }

  /* ── session block ── */
  .session {
    background: transparent;
  }

  .session-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 2px 4px;
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }
  .session-header:hover { background: rgba(255,255,255,0.03); }

  .session-icon {
    font-size: 9px;
    color: var(--session);
    transition: transform 0.2s;
  }
  .session.collapsed .session-icon { transform: rotate(-90deg); }

  .session-name {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    color: var(--session);
    letter-spacing: -0.2px;
  }

  .session-meta {
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
    margin-left: 4px;
  }

  .tag {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 3px;
    margin-left: auto;
  }
  .tag.attached  { background: rgba(80,216,144,0.12); color: var(--active); border: 1px solid rgba(80,216,144,0.2); }
  .tag.current   { background: rgba(80,216,144,0.18); color: var(--active); font-weight: 600; }
  .tag.detached  { background: rgba(78,90,120,0.2);   color: var(--muted);  border: 1px solid var(--border); }

  /* ── windows list ── */
  .windows {
    padding: 4px 0 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .session.collapsed .windows { display: none; }

  /* ── window group (no box — just a label + pane cards) ── */
  .window {
    background: transparent;
  }

  /* a pane has new output → breathing glow on THAT pane only (V01) */
  @keyframes activity-breathe {
    0%, 100% { box-shadow: inset 0 0 0 1px rgba(230,169,74,0.55), 0 0 11px rgba(230,169,74,0.14); }
    50%      { box-shadow: inset 0 0 0 1px rgba(230,169,74,0.90), 0 0 20px rgba(230,169,74,0.32); }
  }

  .window-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 4px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .window-header:hover { background: rgba(255,255,255,0.03); }

  .win-indicator {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--dim);
    flex-shrink: 0;
  }
  .window.is-active .win-indicator { background: var(--window); }

  .win-index {
    font-size: 10px;
    color: var(--muted);
    min-width: 18px;
  }

  .win-name {
    font-size: 12px;
    font-weight: 500;
    color: var(--window);
  }
  .win-spacer { flex: 1 1 auto; }
  .window:not(.is-active) .win-name { color: var(--text); }

  .win-pane-count {
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
  }

  .win-collapse-icon {
    font-size: 9px;
    color: var(--dim);
    transition: transform 0.2s;
  }
  .window.collapsed .win-collapse-icon { transform: rotate(-90deg); }

  /* collapsed = "put away" → header retreats. The title stays dim even
     when events occur — the badge right beside it carries that signal;
     re-coloring the title would make collapsed state unreadable again. */
  .window.collapsed .win-name  { color: var(--muted); }
  .window.collapsed .win-index { color: var(--dim); }
  .session.collapsed .session-name { color: var(--muted); }

  /* ── panes grid ── */
  .panes {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 8px;
    padding: 6px 0 0;
    background: transparent;
  }
  .window.collapsed .panes { display: none; }

  /* ── pane cell ── */
  .pane {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 11px;
    position: relative;
    transition: background 0.15s, border-color 0.15s;
  }
  .pane:hover { background: #1e2330; border-color: var(--border2); }

  /* focused pane of a window — subtle background tint ONLY, a lighter
     shade of the base palette (lightness, not hue). No accent bar /
     border override: those clash with the amber/red glow rings
     (green left edge + amber other edges looked broken). */
  .pane.is-active {
    background: #21262c;
  }
  /* current pane = where your cursor actually is — slightly lighter
     again; the ▸ HERE badge carries the rest of the meaning */
  .pane.is-current {
    background: #293039;
  }

  /* activity indicator in the window header */
  .win-activity {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: var(--window);
  }
  .win-activity .act-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--window);
    box-shadow: 0 0 6px var(--window);
    animation: busy-pulse 1.1s ease-in-out infinite;
  }
  /* per-pane glow already signals activity — only roll it up to the
     header when the window is collapsed and the panes are hidden */
  .window:not(.collapsed) .win-activity { display: none; }
  /* busy = new output detected since last fetch — glow on the pane itself */
  .pane.is-busy {
    background: rgba(230, 169, 74, 0.13);
    border-color: rgba(230,169,74,0.5);
    z-index: 2;
    animation: activity-breathe 1.6s ease-in-out infinite;
  }

  /* fading = activity stopped; slow 60-second fade back to normal */
  @keyframes busy-fade-out {
    from {
      background: rgba(230, 169, 74, 0.13);
      border-color: rgba(230,169,74,0.5);
      box-shadow: inset 0 0 0 1px rgba(230,169,74,0.55), 0 0 11px rgba(230,169,74,0.14);
    }
    to {
      background: var(--bg3);
      border-color: var(--border);
      box-shadow: none;
    }
  }
  .pane.is-fading {
    animation: busy-fade-out 60s linear forwards;
  }

  /* waiting = agent stopped and is asking the USER something — red glow.
     Declared after is-busy/is-fading so it wins when classes co-occur. */
  @keyframes waiting-breathe {
    0%, 100% { box-shadow: inset 0 0 0 1px rgba(240,96,90,0.55), 0 0 11px rgba(240,96,90,0.16); }
    50%      { box-shadow: inset 0 0 0 1px rgba(240,96,90,0.95), 0 0 22px rgba(240,96,90,0.38); }
  }
  .pane.is-waiting {
    background: rgba(240, 96, 90, 0.13);
    border-color: rgba(240,96,90,0.55);
    z-index: 2;
    animation: waiting-breathe 1.3s ease-in-out infinite;
  }

  .waiting-badge {
    font-size: 9px;
    color: var(--waiting);
    font-weight: 700;
    letter-spacing: 0.3px;
    display: inline-flex;
    align-items: center;
    align-self: center;
    gap: 4px;
  }
  .waiting-badge .act-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--waiting);
    box-shadow: 0 0 5px var(--waiting);
    animation: busy-pulse 1.1s ease-in-out infinite;
  }

  /* waiting roll-up in the window header — like win-activity, red */
  .win-waiting {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: var(--waiting);
  }
  .win-waiting .act-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--waiting);
    box-shadow: 0 0 6px var(--waiting);
    animation: busy-pulse 1.1s ease-in-out infinite;
  }
  .window:not(.collapsed) .win-waiting { display: none; }
  /* session-header rollups (.sess) only show when the session is folded */
  .session:not(.collapsed) .win-waiting.sess,
  .session:not(.collapsed) .win-activity.sess { display: none; }

  @keyframes busy-pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.2; }
  }

  .busy-badge {
    font-size: 9px;
    color: var(--window);
    font-weight: 600;
    letter-spacing: 0.3px;
    display: inline-flex;
    align-items: center;
    align-self: center;   /* badge stays centered; text siblings use baseline */
    gap: 4px;
  }
  .busy-badge .act-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--window);
    box-shadow: 0 0 5px var(--window);
    animation: busy-pulse 1.1s ease-in-out infinite;
  }

  /* pane title — a complete, standalone line with nothing flanking it,
     so it can use the full card width */
  .pane-top {
    margin-bottom: 4px;
  }

  .pane-cmd {
    display: block;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.1px;
    color: var(--cmd);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .pane-idx {
    font-size: 9px;
    color: var(--dim);
    min-width: 16px;
  }

  .pane-spacer { flex: 1 1 auto; }

  /* secondary line: idx + command tag (left) · HERE / activity / size (right) */
  .pane-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
    min-height: 16px;     /* keep cards aligned whether or not a tag shows */
  }

  .pane-proc {
    font-size: 9px;
    color: var(--muted);
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 0 5px;
    align-self: center;   /* tag stays centered; text siblings use baseline */
    white-space: nowrap;
    flex-shrink: 0;
  }

  .pane-size {
    font-size: 9px;
    color: var(--dim);
  }

  .active-mark {
    display: inline-flex;
    align-items: center;
    align-self: center;   /* pill stays centered; text siblings use baseline */
    gap: 3px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.6px;
    color: #06140d;
    background: var(--active);
    padding: 1px 7px 1px 5px;
    border-radius: 10px;
    box-shadow: 0 0 7px rgba(61,214,140,0.45);
    animation: here-glow 2s ease-in-out infinite;
  }
  @keyframes here-glow {
    0%, 100% { box-shadow: 0 0 5px rgba(61,214,140,0.40); }
    50%      { box-shadow: 0 0 13px rgba(61,214,140,0.75); }
  }

  .pane-path {
    font-size: 10px;
    color: var(--path);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0.8;
  }

  /* ── preview block ── */
  .preview {
    background: rgba(0,0,0,0.28);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 9px;
    color: #9fb0be;
    line-height: 1.65;
    overflow: hidden;
    font-weight: 400;
    min-height: 96px;
  }

  .preview-line {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: block;
  }

  /* ── footer stat bar ── */
  .stat-bar {
    display: flex;
    gap: 20px;
    padding: 6px 14px;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    font-size: 10px;
    color: var(--muted);
    position: fixed;
    bottom: 0; left: 0; right: 0;
  }
  .stat { display: flex; gap: 5px; align-items: center; }
  .stat-val { color: var(--text); font-weight: 500; }

  /* ── pane zoom modal ── */
  #pane-zoom {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0,0,0,0.72);
    align-items: center;
    justify-content: center;
  }
  #pane-zoom.open { display: flex; }

  .zoom-box {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 12px;
    width: min(940px, 92vw);
    height: min(620px, 86vh);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0,0,0,0.65);
  }

  .zoom-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg3);
    flex-shrink: 0;
  }

  .zoom-target { font-size: 10px; color: var(--session); font-weight: 600; flex-shrink: 0; }
  .zoom-title  { font-size: 12px; color: var(--cmd); font-weight: 600;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .zoom-path   { font-size: 10px; color: var(--path); white-space: nowrap;
                 overflow: hidden; text-overflow: ellipsis; max-width: 220px; opacity: 0.8; }
  .zoom-close  {
    font-size: 16px; line-height: 1; color: var(--muted); cursor: pointer;
    padding: 2px 7px; border-radius: 4px; flex-shrink: 0;
    transition: color 0.15s, background 0.15s;
  }
  .zoom-close:hover { color: var(--text); background: rgba(255,255,255,0.07); }

  .zoom-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: auto;
    padding: 12px 14px;
    background: rgba(0,0,0,0.28);
  }

  .zoom-preview-line {
    display: block;
    font-size: 11px;
    color: #9fb0be;
    line-height: 1.7;
    white-space: pre;
    font-family: var(--mono);
  }

  .zoom-footer {
    font-size: 9px;
    color: var(--muted);
    padding: 4px 14px 6px;
    border-top: 1px solid var(--border);
    text-align: right;
    flex-shrink: 0;
    background: var(--bg3);
  }

  .pane { cursor: pointer; }

  /* demo-mode tag in header */
  #demo-tag {
    display: none;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #06140d;
    background: var(--window);
    padding: 2px 7px;
    border-radius: 4px;
    box-shadow: 0 0 8px rgba(230,169,74,0.45);
  }
  body.demo #demo-tag { display: inline-block; }
  body.demo .status-dot { background: var(--window); }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">tmux<span>.</span>dash</div>
    <div class="badge" id="session-count">— sessions</div>
  </div>
  <div class="header-right">
    <div class="refresh-control">
      <span>refresh</span>
      <input type="range" id="refresh-slider" min="1" max="10" value="2">
      <span id="refresh-label">2s</span>
    </div>
    <div id="demo-tag" title="server not reachable — showing simulated data">DEMO</div>
    <div id="clock">--:--:--</div>
    <div class="status-dot" id="status-dot"></div>
  </div>
</header>

<main id="main">
  <div class="empty">
    <h2>connecting…</h2>
    <p>waiting for tmux server on localhost:8765</p>
  </div>
</main>

<div class="stat-bar">
  <div class="stat">sessions <span class="stat-val" id="s-sessions">—</span></div>
  <div class="stat">windows <span class="stat-val" id="s-windows">—</span></div>
  <div class="stat">panes <span class="stat-val" id="s-panes">—</span></div>
  <div class="stat">last update <span class="stat-val" id="s-updated">—</span></div>
</div>

<div id="pane-zoom">
  <div class="zoom-box">
    <div class="zoom-header">
      <span class="zoom-target" id="zoom-target"></span>
      <span class="zoom-title"  id="zoom-title"></span>
      <span class="zoom-path"   id="zoom-path"></span>
      <span class="zoom-close"  onclick="closeZoom()">✕</span>
    </div>
    <div class="zoom-body" id="zoom-body"></div>
    <div class="zoom-footer" id="zoom-ts"></div>
  </div>
</div>

<script>
const API      = 'http://localhost:8765/api/tmux';
const PANE_API = 'http://localhost:8765/api/pane';
let refreshSec = 2;
let timer = null;

// ── clock ──────────────────────────────────────────────────
function tickClock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('zh-TW', { hour12: false });
}
setInterval(tickClock, 1000);
tickClock();

// ── refresh slider ─────────────────────────────────────────
const slider = document.getElementById('refresh-slider');
const refreshLabel = document.getElementById('refresh-label');
slider.addEventListener('input', () => {
  refreshSec = +slider.value;
  refreshLabel.textContent = refreshSec + 's';
  reschedule();
});

// ── collapse state ─────────────────────────────────────────
const collapsedSessions = new Set();
const collapsedWindows  = new Set();

// ── auto-fold ──────────────────────────────────────────────
// A window with no events (activity / waiting) for AUTO_FOLD_AFTER ms
// folds itself. The window holding the cursor (HERE pane) is exempt, and
// a manually expanded window stays open until its NEXT event re-arms the
// timer. First sighting seeds the baseline so page load folds nothing.
const AUTO_FOLD_AFTER = 180000;   // 3 minutes
const winLastEvent  = new Map();  // wkey → timestamp of last event
const manualExpand  = new Set();  // wkey → user opened it; auto-fold backs off

// ── waiting notification ───────────────────────────────────
// Browser notification when a pane transitions not-waiting → waiting.
// Deduped per pane: silent while the pane KEEPS waiting, re-armed once it
// stops. Permission asked once on load; declined → notifications silently
// skipped (the red glow still shows).
const notifiedWaiting = new Set();
if ('Notification' in window && Notification.permission === 'default') {
  Notification.requestPermission();
}

// pane.title is attacker-influenced (select-pane -T / OSC escapes) and the
// notification can show on a lock screen — strip C0+DEL+C1 control chars,
// cap length.
function sanitizeLabel(s) {
  return String(s).replace(/[\u0000-\u001f\u007f-\u009f]/g, '').slice(0, 60);
}

// Returns true only when a notification actually fired — the caller gates
// the dedupe entry on this, so a pane that turns waiting BEFORE the user
// answers the permission prompt still notifies once permission arrives.
function notifyWaiting(key, label) {
  if (DEMO) return false;   // demo's simulated waiting pane must not notify
  if (!('Notification' in window) || Notification.permission !== 'granted') return false;
  // tag dedupes at the OS level too, if a stale one is still on screen
  const n = new Notification('tmux.dash', { body: `${sanitizeLabel(label)} 在等你回覆`, tag: key });
  n.onclick = () => { window.focus(); n.close(); };
  return true;
}

// ── busy detection ──────────────────────────────────────────
// A pane is "busy" for BUSY_TTL ms after its last activity, then slowly
// fades back to normal over FADE_DURATION ms.
//
// Two activity sources, chosen by the server (data.activity_source):
//   'tmux' — pane_last_activity (epoch seconds), native + catches output
//            that scrolled away between polls. Used when tmux supports it.
//   'hash' — compare preview content between polls. Fallback for older tmux.
const BUSY_TTL      = 8000;   // ms of active glow after last activity
const FADE_DURATION = 60000;  // ms for the slow fade-out (1 minute)
const BIRTH_GRACE   = 5000;   // ms after first sighting where hash changes
                              // don't glow — a new pane drawing its shell
                              // prompt is not "activity"
let   activitySource = 'hash'; // set from server response; safe default
const prevHash    = new Map(); // key → last content hash   (hash mode)
const lastChanged = new Map(); // key → timestamp of last change (hash mode)
const fadeStart   = new Map(); // key → timestamp when fade-out began (hash mode)
const prevSize    = new Map(); // key → last pane size — a size change means
                               // the content REWRAPPED (split/resize), not output
const paneBirth   = new Map(); // key → timestamp the key was first seen

function simpleHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(31, h) + str.charCodeAt(i) | 0;
  }
  return h.toString(36);
}

function paneKey(sessName, winIdx, paneIdx) {
  return `${sessName}:${winIdx}.${paneIdx}`;
}

// Returns { state: 'busy'|'fading'|'none', fadeElapsed: ms-into-fade }.
// fadeElapsed feeds a negative animation-delay so the CSS fade lands at the
// right point even though the DOM is rebuilt every render.
function checkBusy(key, pane) {
  const now = Date.now();

  if (activitySource === 'tmux') {
    // tmux gives the activity timestamp directly — fully stateless.
    const elapsedMs = now - pane.last_activity * 1000;
    if (elapsedMs < BUSY_TTL) return { state: 'busy', fadeElapsed: 0 };
    const fadeElapsed = elapsedMs - BUSY_TTL;
    if (fadeElapsed < FADE_DURATION) return { state: 'fading', fadeElapsed };
    return { state: 'none', fadeElapsed: 0 };
  }

  // hash fallback — detect activity by content change between polls.
  // Prefer the server's full-capture hash: it sees the spinner/timer line
  // ticking ABOVE the static status bar that fills the 5-line preview.
  // Old servers without the field → hash the preview as before.
  const hash = pane.content_hash || simpleHash(pane.preview.join('\n'));
  if (!paneBirth.has(key)) paneBirth.set(key, now);
  // a size change means the content REWRAPPED (split / resize) — the hash
  // moves with no real output, so that poll must not count as activity
  const sizeChanged = prevSize.get(key) !== pane.size;
  prevSize.set(key, pane.size);
  if (prevHash.has(key) && prevHash.get(key) !== hash) {
    const inBirthGrace = (now - paneBirth.get(key)) < BIRTH_GRACE;
    if (!sizeChanged && !inBirthGrace) {
      lastChanged.set(key, now);
      fadeStart.delete(key);   // new activity cancels any in-progress fade
    }
  }
  prevHash.set(key, hash);

  const changed = lastChanged.get(key);
  if (!changed) return { state: 'none', fadeElapsed: 0 };
  if ((now - changed) < BUSY_TTL) return { state: 'busy', fadeElapsed: 0 };

  // Past the active glow window — start or continue the slow fade
  if (!fadeStart.has(key)) fadeStart.set(key, now);
  const fadeElapsed = now - fadeStart.get(key);
  if (fadeElapsed >= FADE_DURATION) {
    fadeStart.delete(key);
    lastChanged.delete(key);
    return { state: 'none', fadeElapsed: 0 };
  }
  return { state: 'fading', fadeElapsed };
}

// ── render ─────────────────────────────────────────────────
function render(data) {
  const dot = document.getElementById('status-dot');
  const main = document.getElementById('main');

  // Pick activity-detection mode from the server (tmux-native vs hash).
  if (data.activity_source) activitySource = data.activity_source;

  if (data.error || !data.sessions || data.sessions.length === 0) {
    dot.className = 'status-dot error';
    main.innerHTML = `<div class="empty">
      <h2>no sessions</h2>
      <p>${data.error || 'no active tmux sessions found'}</p>
    </div>`;
    return;
  }

  dot.className = 'status-dot';

  let totalWindows = 0, totalPanes = 0;
  // pane keys seen this render — panes killed WHILE waiting never hit the
  // !isWaiting cleanup branch, so their notifiedWaiting entries are reaped
  // against this set after the loop (else pane-index reuse would suppress
  // a future real notification).
  const seenKeys = new Set();
  const seenWkeys = new Set();
  const nowTs = Date.now();

  const html = data.sessions.map(sess => {
    totalWindows += sess.window_count;

    const isCurrentSess = sess.current;
    const isCollapsed   = collapsedSessions.has(sess.name);
    let sessBusy = false, sessWaiting = false;

    const windowsHtml = sess.windows.map(win => {
      totalPanes += win.panes.length;

      const wkey = sess.name + ':' + win.index;
      seenWkeys.add(wkey);
      const isActiveWin  = win.active;
      let winBusy = false;
      let winWaiting = false;

      const panesHtml = win.panes.map(pane => {
        // key by tmux pane_id (%N — unique, survives index renumbering when
        // a sibling is killed); composite key only for old servers / demo
        const key = pane.id || paneKey(sess.name, win.index, pane.index);
        seenKeys.add(key);
        const { state: busyState, fadeElapsed } = checkBusy(key, pane);
        const isWaiting = !!pane.waiting;
        // waiting wins — red glow replaces the amber busy/fading glow
        let isBusy   = busyState === 'busy';
        let isFading = busyState === 'fading';
        isBusy   = isBusy   && !isWaiting;
        isFading = isFading && !isWaiting;
        if (isBusy) winBusy = true;  // window badge only for active busy, not slow fade
        if (isWaiting) winWaiting = true;

        const previewHtml = pane.preview.length
          ? `<div class="preview">${pane.preview.map(l =>
              `<span class="preview-line">${escHtml(l)}</span>`
            ).join('')}</div>`
          : '';

        // Main label is the tmux pane title (set via `select-pane -T` / escape
        // seq); fall back to the running command when no custom title is set.
        // When a title IS set, the command is shown as a small secondary tag.
        const hasTitle = pane.title && pane.title !== pane.command;
        const mainLabel = pane.title || pane.command;
        const procTag = hasTitle
          ? `<span class="pane-proc">${escHtml(pane.command)}</span>` : '';

        // notify on transition not-waiting → waiting, once per episode
        if (isWaiting && !notifiedWaiting.has(key)) {
          // gate on success: during the permission-prompt window nothing
          // fires, and the episode must still notify once permission lands
          if (notifyWaiting(key, mainLabel)) notifiedWaiting.add(key);
        } else if (!isWaiting) {
          notifiedWaiting.delete(key);
        }

        // For fading panes, use a negative animation-delay so the CSS animation
        // starts at the correct elapsed point even after DOM reconstruction.
        const fadeStyle = isFading ? ` style="animation-delay:-${fadeElapsed}ms"` : '';

        const zTarget = `${sess.name}:${win.index}.${pane.index}`;
        return `<div class="pane${pane.active ? ' is-active' : ''}${pane.current ? ' is-current' : ''}${isBusy ? ' is-busy' : ''}${isFading ? ' is-fading' : ''}${isWaiting ? ' is-waiting' : ''}"${fadeStyle}
          onclick="event.stopPropagation();openZoom('${escHtml(zTarget)}','${escHtml(mainLabel)}','${escHtml(pane.path)}')">
          <div class="pane-top">
            <span class="pane-cmd" title="${escHtml(mainLabel)}">${escHtml(mainLabel)}</span>
          </div>
          <div class="pane-meta">
            <span class="pane-idx">${pane.index}</span>
            ${procTag}
            <span class="pane-spacer"></span>
            ${pane.current ? '<span class="active-mark">▸ HERE</span>' : ''}
            ${isWaiting ? '<span class="waiting-badge"><span class="act-dot"></span>⏸ waiting</span>' : ''}
            ${isBusy ? '<span class="busy-badge"><span class="act-dot"></span>activity</span>' : ''}
            <span class="pane-size">${pane.size}</span>
          </div>
          <div class="pane-path">${escHtml(pane.path)}</div>
          ${previewHtml}
        </div>`;
      }).join('');

      if (winBusy) sessBusy = true;
      if (winWaiting) sessWaiting = true;

      // auto-fold bookkeeping — events refresh the clock and re-arm the
      // manual-expand exemption; quiet windows fold after the timeout
      const hasCurrent = win.panes.some(p => p.current);
      if (!winLastEvent.has(wkey)) winLastEvent.set(wkey, nowTs);
      if (winBusy || winWaiting) {
        winLastEvent.set(wkey, nowTs);
        manualExpand.delete(wkey);
      }
      if (!hasCurrent && !manualExpand.has(wkey) &&
          nowTs - winLastEvent.get(wkey) > AUTO_FOLD_AFTER) {
        collapsedWindows.add(wkey);
      }
      const winCollapsed = collapsedWindows.has(wkey);

      return `<div class="window${isActiveWin ? ' is-active' : ''}${winBusy ? ' is-busy' : ''}${winWaiting ? ' is-waiting' : ''}${winCollapsed ? ' collapsed' : ''}"
                   data-wkey="${escHtml(wkey)}">
        <div class="window-header" onclick="toggleWindow('${escHtml(wkey)}')">
          <div class="win-indicator"></div>
          <div class="win-index">#${win.index}</div>
          <div class="win-name">${escHtml(win.name)}</div>
          ${winWaiting ? '<span class="win-waiting"><span class="act-dot"></span>⏸ waiting</span>'
                       : winBusy ? '<span class="win-activity"><span class="act-dot"></span>activity</span>' : ''}
          <span class="win-spacer"></span>
          <div class="win-pane-count">${win.panes.length} pane${win.panes.length !== 1 ? 's' : ''}</div>
          <div class="win-collapse-icon">▾</div>
        </div>
        <div class="panes">${panesHtml}</div>
      </div>`;
    }).join('');

    const tagHtml = sess.current
      ? '<span class="tag current">current</span>'
      : sess.attached
        ? '<span class="tag attached">attached</span>'
        : '<span class="tag detached">detached</span>';

    return `<div class="session${isCurrentSess ? ' is-current' : ''}${sessBusy ? ' is-busy' : ''}${sessWaiting ? ' is-waiting' : ''}${isCollapsed ? ' collapsed' : ''}"
                 data-session="${escHtml(sess.name)}">
      <div class="session-header" onclick="toggleSession('${escHtml(sess.name)}')">
        <span class="session-icon">▾</span>
        <span class="session-name">${escHtml(sess.name)}</span>
        ${sessWaiting ? '<span class="win-waiting sess"><span class="act-dot"></span>⏸ waiting</span>'
                      : sessBusy ? '<span class="win-activity sess"><span class="act-dot"></span>activity</span>' : ''}
        <span class="session-meta">${sess.window_count} win</span>
        ${tagHtml}
      </div>
      <div class="windows">${windowsHtml}</div>
    </div>`;
  }).join('');

  main.innerHTML = html;

  // reap dedupe entries for panes that vanished (closed while waiting)
  for (const k of notifiedWaiting) {
    if (!seenKeys.has(k)) notifiedWaiting.delete(k);
  }
  // reap hash-mode state for vanished panes — tmux reuses pane indexes,
  // and a stale hash under the same key makes a freshly split pane glow
  // "activity" at birth (compared against the dead pane's content).
  for (const k of [...prevHash.keys()]) {
    if (!seenKeys.has(k)) {
      prevHash.delete(k);
      lastChanged.delete(k);
      fadeStart.delete(k);
      prevSize.delete(k);
      paneBirth.delete(k);
    }
  }
  // prune window-keyed state too — a recreated window reusing the index
  // must not inherit stale fold/exemption/event state
  for (const k of [...winLastEvent.keys()]) {
    if (!seenWkeys.has(k)) {
      winLastEvent.delete(k);
      manualExpand.delete(k);
      collapsedWindows.delete(k);
    }
  }

  // stats
  document.getElementById('session-count').textContent =
    data.sessions.length + ' session' + (data.sessions.length !== 1 ? 's' : '');
  document.getElementById('s-sessions').textContent = data.sessions.length;
  document.getElementById('s-windows').textContent  = totalWindows;
  document.getElementById('s-panes').textContent    = totalPanes;
  document.getElementById('s-updated').textContent  =
    new Date().toLocaleTimeString('zh-TW', { hour12: false });
}

// ── collapse toggles ───────────────────────────────────────
function toggleSession(name) {
  if (collapsedSessions.has(name)) collapsedSessions.delete(name);
  else collapsedSessions.add(name);
  const el = document.querySelector(`.session[data-session="${name}"]`);
  if (el) el.classList.toggle('collapsed');
}

function toggleWindow(wkey) {
  if (collapsedWindows.has(wkey)) {
    collapsedWindows.delete(wkey);
    manualExpand.add(wkey);     // user wants it open — auto-fold backs off
  } else {
    collapsedWindows.add(wkey);
    manualExpand.delete(wkey);
  }
  const el = document.querySelector(`.window[data-wkey="${wkey}"]`);
  if (el) el.classList.toggle('collapsed');
}

// ── demo / simulation mode ─────────────────────────────────
// When the server is unreachable, show simulated data that keeps
// changing so activity glow, HERE marker, and auto-refresh are visible.
let demoTick = 0;
function makeDemoData() {
  demoTick++;
  const t = demoTick;
  const stamp = new Date().toLocaleTimeString('zh-TW', { hour12: false });
  // HERE marker hops between two panes every ~12 ticks
  const hereOnEditor = Math.floor(t / 12) % 2 === 0;

  return { sessions: [{
    name: 'main', current: true, attached: true, window_count: 2,
    windows: [
      { index: '0', name: 'editor', active: true, panes: [
        // nvim: cursor lives here (HERE), static content → no activity
        { index: '0', active: true, current: hereOnEditor,
          command: 'nvim', title: 'edit dashboard', path: '~/dev/tmux-dashboard', size: '96×42',
          preview: ['  1 <!DOCTYPE html>', '  2 <html lang="zh-Hant">', '  3 <head>',
            '  4   <meta charset="UTF-8">', '  5   <title>tmux.dash</title>',
            '  6 </head>', '  7 <body>'] },
        // node dev server: emits a line every 3 ticks → intermittent activity
        { index: '1', active: false, current: false,
          command: 'node', path: '~/dev/tmux-dashboard', size: '64×42',
          preview: ['> vite v5 ready in 312 ms', '> Local:   http://localhost:5173/',
            '> Network: use --host to expose', '> press h + enter to show help',
            ...(t % 3 === 0 ? ['> hmr update /src/app.jsx ' + stamp] : [])] },
        // claude code: stopped on a permission prompt → waiting (red glow)
        { index: '2', active: false, current: false, waiting: true,
          command: 'claude', title: 'claude code', path: '~/dev/tmux-dashboard', size: '96×42',
          preview: ['● Edit file tmux_server.py', 'Do you want to proceed?',
            '❯ 1. Yes', '  2. Yes, and don\'t ask again',
            '  3. No, and tell Claude what to do differently (esc)'] },
      ]},
      { index: '1', name: 'server', active: false, panes: [
        // python3 api: logs every tick → steadily lit (activity)
        { index: '0', active: true, current: !hereOnEditor,
          command: 'python3', title: 'api server', path: '~/dev/tmux-dashboard', size: '120×50',
          preview: ['  tmux dashboard server running → :8765', 'Ctrl-C to stop',
            '127.0.0.1 - GET /api/tmux 200', '127.0.0.1 - GET /api/tmux 200',
            '127.0.0.1 - GET /api/tmux 200', '127.0.0.1 - GET /api/tmux 200  ' + stamp] },
        // htop: cpu numbers tick every 2 → intermittent activity
        { index: '1', active: false, current: false,
          command: 'htop', path: '~', size: '120×24',
          preview: ['CPU[' + '|'.repeat(3 + (t % 6)) + ']  ' + (18 + (t * 7) % 40) + '%',
            'Mem[||||||      ]  5.2G/16G', 'Swp[             ]  0K/2G',
            'Tasks: 212, 41 running', 'load average: ' + (0.3 + (t % 5) * 0.11).toFixed(2) + ' 0.51 0.60',
            'Uptime: 4 days, 02:17'] },
        // tail: quiet log → no activity
        { index: '2', active: false, current: false,
          command: 'tail', path: '/var/log', size: '120×24',
          preview: ['[INFO] worker started pid=4821', '[INFO] queue drained (0 pending)',
            '[INFO] checkpoint written', '[INFO] heartbeat ok'] },
      ]},
    ],
  }]};
}

// ── fetch ──────────────────────────────────────────────────
// Demo mode is OPT-IN via ?demo=true — it never kicks in on its own,
// so a real connection problem always surfaces honestly.
const DEMO = (() => {
  const v = new URLSearchParams(location.search).get('demo');
  return v !== null && v !== 'false' && v !== '0';
})();

// Guard against overlapping polls: a slow server response (many panes /
// busy TUI) must not let the next interval tick fire a second request on
// top of it — overlapping fetches pile load on tmux and cause the flicker.
let inFlight = false;

// A single slow/aborted poll must NOT wipe the last good view — that's the
// "flash". Tolerate transient failures: keep the existing render and only
// fall back to the error state after FAIL_THRESHOLD consecutive failures.
let failCount = 0;
const FAIL_THRESHOLD = 2;

async function fetchData() {
  if (DEMO) {
    document.body.classList.add('demo');
    render(makeDemoData());
    return;
  }
  if (inFlight) return;   // previous poll still running — skip this tick
  inFlight = true;
  try {
    // Abort window is generous (8s) so a normal — parallel-fetched — server
    // response always finishes; only a truly dead server trips the catch.
    const res = await fetch(API, { cache: 'no-store', signal: AbortSignal.timeout(8000) });
    const data = await res.json();
    failCount = 0;
    document.body.classList.remove('demo');
    render(data);
  } catch (e) {
    failCount++;
    // dim the status dot immediately, but keep the last good render so a
    // one-off timeout doesn't flash the whole UI to an error screen.
    document.getElementById('status-dot').className = 'status-dot error';
    if (failCount >= FAIL_THRESHOLD) {
      document.body.classList.remove('demo');
      document.getElementById('main').innerHTML = `<div class="empty">
        <h2>cannot connect</h2>
        <p>make sure <code>python3 tmux_server.py</code> is running</p>
        <p class="empty-link"><a href="?demo=true">view demo with sample data →</a></p>
      </div>`;
    }
  } finally {
    inFlight = false;
  }
}

function reschedule() {
  clearInterval(timer);
  timer = setInterval(fetchData, refreshSec * 1000);
  if (zoomTarget) {
    clearInterval(zoomTimer);
    zoomTimer = setInterval(fetchZoom, refreshSec * 1000);
  }
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── pane zoom modal ────────────────────────────────────────
let zoomTarget = null;
let zoomTimer  = null;

function openZoom(target, title, path) {
  zoomTarget = target;
  document.getElementById('zoom-target').textContent = target;
  document.getElementById('zoom-title').textContent  = title || target;
  document.getElementById('zoom-path').textContent   = path  || '';
  document.getElementById('pane-zoom').classList.add('open');
  fetchZoom();
  clearInterval(zoomTimer);
  zoomTimer = setInterval(fetchZoom, refreshSec * 1000);
}

function closeZoom() {
  document.getElementById('pane-zoom').classList.remove('open');
  clearInterval(zoomTimer);
  zoomTimer  = null;
  zoomTarget = null;
}

async function fetchZoom() {
  if (!zoomTarget) return;
  try {
    const body = document.getElementById('zoom-body');
    const atBottom = body.scrollHeight - body.scrollTop <= body.clientHeight + 5;
    const res = await fetch(
      `${PANE_API}?target=${encodeURIComponent(zoomTarget)}`,
      { cache: 'no-store', signal: AbortSignal.timeout(5000) }
    );
    const data = await res.json();
    body.innerHTML = data.lines.length
      ? data.lines.map(l => `<span class="zoom-preview-line">${escHtml(l)}</span>`).join('')
      : '<span class="zoom-preview-line" style="color:var(--muted)">— pane is empty —</span>';
    if (atBottom) body.scrollTop = body.scrollHeight;
    document.getElementById('zoom-ts').textContent =
      'updated ' + new Date().toLocaleTimeString('zh-TW', { hour12: false });
  } catch(e) { /* keep last render on transient failure */ }
}

// close on backdrop click (target must be the overlay itself, not the inner box)
document.getElementById('pane-zoom').addEventListener('click', function(e) {
  if (e.target === this) closeZoom();
});

// ESC to close
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeZoom(); });

// kick off
fetchData();
reschedule();
</script>
</body>
